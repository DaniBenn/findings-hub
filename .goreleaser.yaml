# GoReleaser config: https://goreleaser.com
# Release = push a tag "vX.Y.Z" -> .github/workflows/release.yml runs this.
version: 2
project_name: fhub

builds:
  - id: fhub
    main: ./cmd/fhub
    binary: fhub
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    # Reproducible builds: same source -> same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fhub
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (generated with syft). We sell supply-chain hygiene,
# so our own releases ship with it.
sboms:
  - artifacts: archive

# Keyless signing via Sigstore: the GitHub Actions OIDC identity of the
# release workflow signs checksums.txt (which covers every archive).
# Verify with the command in docs/RELEASING.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]

release:
  draft: false
  prerelease: auto
  footer: |
    **Verify this release:** see [docs/RELEASING.md](https://github.com/DaniBenn/findings-hub/blob/main/docs/RELEASING.md#verifying-a-release).
