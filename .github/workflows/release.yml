name: release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege by default; the job below asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
      id-token: write      # keyless cosign signing + build provenance
      attestations: write  # build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build provenance. GitHub offers attestations for public repos on
      # all plans (private repos need Enterprise), so skip while private.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/checksums.txt

  # Verify the published release like a user would (signature, checksums,
  # provenance, Action on all OSes).
  smoke:
    needs: release
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}

  # Move the floating major tag (v0, v1, ...) so `uses: DaniBenn/findings-hub@v0`
  # follows the latest release. Only after the smoke test passed, and never for
  # pre-releases (v1.2.0-rc.1).
  float-major-tag:
    needs: smoke
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: point v<major> at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.*.*) ;; *) echo "unexpected tag $TAG"; exit 1 ;; esac
          major="${TAG%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$major" --jq '.[].ref' | grep -qx "refs/tags/$major"; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$SHA" > /dev/null
          fi
          echo "$major -> $TAG ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
