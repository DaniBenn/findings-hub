version: 2
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the pin and the
  # "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
